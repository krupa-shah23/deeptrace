[project]
name = "deepfake"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.0",
    "ffmpeg-python>=0.2.0",
    "imagehash>=4.3.2",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.1",
    "mediapipe==0.10.14",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "reportlab>=5.0.0",
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
